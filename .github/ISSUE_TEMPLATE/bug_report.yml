name: Bug/Issue Report
description: Create a bug/issue detailing something that is broken or not working correctly
labels: ["bug"]
assignees:
  - stevekirtley
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report, and first may I say I'm sorry that you've encountered an issue.

        **Tip:** GitHub opens links in this form in the same tab, which loses anything you've typed. Middle-click, or Ctrl/Cmd+click, to open the links below in a new tab instead. Everything you need to gather logs is repeated on this page so you shouldn't need to leave it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of what the bug/issue is
      placeholder: ex. target rate sensor with the following settings is not turning on
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Please provide steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Please provide a clear and concise description of what you expected to happen
    validations:
      required: true
  - type: input
    id: tariff
    attributes:
      label: Tariff Code
      description: The tariff code that is located in your `current_rate` sensors. This might help identify issues that are related to specific tariffs
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration Version
      description: The version of the integration that you encountered the bug on
    validations:
      required: true
  - type: input
    id: ha-integration
    attributes:
      label: Home Assistant Version
      description: The version of Home Assistant you're currently running
    validations:
      required: true
  - type: dropdown
    id: freshinstall
    attributes:
      label: Fresh Install?
      description: What this encountered after upgrading or a fresh install
      options:
        - Not specified
        - Fresh install
        - After upgrading
    validations:
      required: true
  - type: textarea
    id: ha-logs
    attributes:
      label: Home Assistant Logs
      description: |
        Paste any related Home Assistant logs here. To gather them, without leaving this page:

        1. In Home Assistant, go to **Settings → Devices & Services → EDF Energy**
        2. Click the three dots menu and choose **Enable debug logging**
        3. Reproduce the problem, then choose **Disable debug logging** — the log downloads automatically

        Please remove any personal information (email address, account number, MPAN/MPRN, meter serial numbers) before pasting. More detail in the [FAQ](https://stevekirtley.github.io/HomeAssistant-EDFEnergy/faq#how-do-i-increase-the-logs-for-the-integration) — Ctrl/Cmd+click to open it in a new tab.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      description: 
      options:
        - label: I confirm that I cannot find my solution within the [documentation](https://stevekirtley.github.io/HomeAssistant-EDFEnergy)
          required: true
        - label: I confirm that I cannot find my solution within the [FAQ](https://stevekirtley.github.io/HomeAssistant-EDFEnergy/faq)
          required: true
