blueprint:
  name: EDF Energy - Consumption Baseline Approaching Alert
  description: >
    Get an alert when your consumption for the current interval reaches a certain percentage of a
    target baseline.

    Note: EDF Energy does not provide a live/current consumption feed (unlike Octopus), so this
    blueprint can't use an EDF sensor for live usage. Instead point the interval entity at a live
    source you already have in Home Assistant - a Hildebrand Glow / Bright feed, a CT clamp such as
    a Shelly EM, or an inverter grid-import sensor - via a utility meter with a short cycle. See the
    interval entity description below.
  domain: automation
  author: BottlecapDave (amended for EDF Energy by Steve Kirtley)
  input:
    interval_consumption_entity:
      name: Interval consumption entity
      description: >
        A sensor reporting how much you've consumed so far in the current interval. EDF does not
        expose this, so create a utility meter with a 30 minute or hourly cycle pointed at your live
        import source (e.g. sensor.glow_smart_meter_<id>_smart_meter_electricity_import for a
        Hildebrand Glow / Bright feed, a Shelly EM channel, or your inverter's grid-import sensor)
        and select that utility meter here.
      selector:
        entity:
          filter:
          - domain:
            - sensor
    baseline_entity:
      name: Baseline entity
      description: >
        A sensor or helper reporting your target baseline for the interval, in the same units and
        over the same period as the interval entity above (e.g. an input_number helper or a template
        sensor holding your budget in kWh).
      selector:
        entity:
          filter:
          - domain:
            - sensor
            - input_number
    percentage_threshold:
      name: Percentage Threshold
      description: The minimum percentage of the baseline that is reached for the automation to be triggered
      default: 90
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1.0
    actions:
      name: Actions
      description: Notifications or similar to be run. {{message}} is an example message
      selector:
        action: {}
trigger_variables:
  interval_consumption_entity: !input interval_consumption_entity
  baseline_entity: !input baseline_entity
  percentage_threshold: !input percentage_threshold
variables:
  current_percentage: >
    {% set interval = states(interval_consumption_entity) | float(0) %}
    {% set baseline = states(baseline_entity) | float(0) %}
    {% if interval and baseline %}
      {% set percentage = (interval / baseline * 100) %}
      {{ percentage }}
    {% else %}
      0
    {% endif %}
  message: 'You have reached {{ current_percentage | round(2) }}% of your current baseline ({{ states(baseline_entity) | round(2) }} kWh).'
mode: queued
max: 4
trigger:
- platform: template
  value_template: >
    {% set interval = states(interval_consumption_entity) | float(0) %}
    {% set baseline = states(baseline_entity) | float(0) %}
    {% if interval and baseline %}
      {% set current_percentage = (interval / baseline * 100) %}
    {% else %}
      {% set current_percentage = 0 %}
    {% endif %}
    {{ current_percentage >= percentage_threshold }}
condition: []
action:
- choose: []
  default: !input actions
