join_sunday_saver:
  name: Join Sunday Saver
  description: Opts the account into the EDF Sunday Saver challenge. Checks enrollment first and skips if already registered. Refreshes the Sunday Saver coordinator on success.
  fields:
    account_id:
      name: Account ID
      description: The EDF account number to enrol (e.g. A-XXXXXXXX). If omitted, all configured accounts are enrolled.
      required: false
      selector:
        text:

purge_invalid_external_statistic_ids:
  name: Purge invalid external statistics
  description: Removes external statistics for all meters that don't have an active tariff

refresh_previous_consumption_data:
  name: Refresh previous consumption data
  description: Refreshes the previous consumption data for a given entity from a given date.
  target:
    entity:
      integration: edf_energy
      domain: sensor
  fields:
    start_date:
      name: Date
      description: The date the data should be loaded from.
      required: true
      selector:
        date:

update_cost_tracker:
  name: Update cost tracker
  description: Updates cost tracker information.
  target:
    entity:
      integration: edf_energy
      domain: sensor
  fields:
    is_tracking_enabled:
      name: Is tracking enabled
      description: Determines if the cost tracker should be enabled or disabled.
      selector:
        boolean:

reset_cost_tracker:
  name: Reset cost tracker
  description: Resets a given cost tracker back to zero.
  target:
    entity:
      integration: edf_energy
      domain: sensor

adjust_accumulative_cost_tracker:
  name: Adjusts accumulative cost tracker
  description: Adjusts a record within an accumulative cost tracker (e.g. sensor.edf_energy_cost_tracker_{{COST_TRACKER_NAME}}_week or sensor.edf_energy_cost_tracker_{{COST_TRACKER_NAME}}_month)
  target:
    entity:
      integration: edf_energy
      domain: sensor
  fields:
    date:
      name: Date
      description: The date to adjust within the accumulative cost tracker
      selector:
        date:
    cost:
      name: Cost
      description: The new cost for the selected date
      selector:
        number:
          step: any
          mode: box
          unit_of_measurement: GBP
    consumption:
      name: Consumption
      description: The new consumption for the selected date
      selector:
        number:
          step: any
          mode: box
          unit_of_measurement: kWh

adjust_cost_tracker:
  name: Adjusts cost tracker
  description: Adjusts a record within todays cost tracker (e.g. sensor.edf_energy_cost_tracker_{{COST_TRACKER_NAME}})
  target:
    entity:
      integration: edf_energy
      domain: sensor
  fields:
    datetime:
      name: DateTime
      description: The datetime of the period to adjust within the cost tracker
      selector:
        datetime:
    consumption:
      name: Consumption
      description: The new consumption for the selected date
      selector:
        number:
          step: any
          mode: box
          unit_of_measurement: kWh


refresh_intelligent_dispatches:
  name: Refresh smart charging dispatches
  description: Refreshes the smart charging dispatches.
  target:
    entity:
      integration: edf_energy
      domain: binary_sensor

get_point_in_time_intelligent_dispatch_history:
  name: Get point in time smart charging dispatch history
  description:
    Retrieve the smart charging dispatch history which was active for a given point in time based on up to the last 48 hours of dispatches that have been captured locally.
  target:
    entity:
      integration: edf_energy
      domain: binary_sensor
  fields:
    point_in_time:
      name: Point in time
      description: The datetime of the point in time to retrieve the application intelligent dispatch history for
      selector:
        datetime: