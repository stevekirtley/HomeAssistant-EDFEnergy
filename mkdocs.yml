site_name: Home Assistant EDF Energy
site_url: https://stevekirtley.github.io/HomeAssistant-EDFEnergy/
repo_url: https://github.com/stevekirtley/HomeAssistant-EDFEnergy
docs_dir: _docs

nav:
  - Home: index.md
  - Setup:
    - ./setup/account.md
    - ./setup/cost_tracker.md
    - ./setup/tariff_comparison.md
    - ./setup/energy_dashboard.md
  - Entities:
    - Electricity: ./entities/electricity.md
    - Gas: ./entities/gas.md
    - Intelligent: ./entities/intelligent.md
    - Free Electricity: ./entities/free_electricity.md
    - Diagnostics: ./entities/diagnostics.md
  - Migrations:
    - ./migrations/target_timeframes.md
  - services.md
  - events.md
  - Repairs:
    - ./repairs/account_not_found.md
    - ./repairs/unknown_product.md
    - ./repairs/cost_override_obsolete.md
    - ./repairs/unknown_intelligent_provider.md
    - ./repairs/no_active_tariff.md
    - ./repairs/meter_removed.md
    - ./repairs/tariff_rates_empty.md
  - blueprints.md
  - Architecture Decision Records:
    - ./architecture_decision_records/0001_target_rates_removal.md
    - ./architecture_decision_records/0002_intelligent_is_dispatching_behaviour_changes.md
  - faq.md

# extra:
#   version:
#     provider: mike

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - toc:
      permalink: "#"

plugins:
  - search
  - git-authors:
      show_email_address: false

theme:
  name: material
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: light blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn